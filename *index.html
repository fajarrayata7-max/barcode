<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mau Balikan Gaa?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe6e9;
            overflow: hidden;
        }

        .card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            min-height: 50px;
            position: relative;
        }

        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        #btnYes {
            background-color: #28a745;
            color: white;
        }

        #btnYes:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        #btnNo {
            background-color: #dc3545;
            color: white;
            position: relative;
            z-index: 10;
        }

        .message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #495057;
            min-height: 50px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>MAU BALIKAN GAA?</h1>
        
        <div class="button-group">
            <button id="btnYes">MAU</button>
            <button id="btnNo">ENGGA</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const message = document.getElementById('message');

        // Klik Tombol YES (MAU)
        btnYes.addEventListener('click', () => {
            message.innerHTML = "MAAFIN BANG FAJAR YAAA SAYANG KENI :* ❤️️";
            message.style.color = "#d63384";
            
            // Kembalikan posisi tombol NO ke posisi semula jika sebelumnya dipindah
            btnNo.style.position = 'static';
        });

        // Klik Tombol NO (ENGGA)
        btnNo.addEventListener('click', () => {
            message.innerHTML = "YAAAHH GABISA HAHAHAH :p";
            message.style.color = "#dc3545";

            // Ubah position ke absolute agar bisa pindah bebas di layar
            btnNo.style.position = 'fixed';

            // Hitung posisi random (pastikan tetap berada di area layar/viewport)
            const padding = 20;
            const maxX = window.innerWidth - btnNo.offsetWidth - padding;
            const maxY = window.innerHeight - btnNo.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            // Set posisi baru tombol NO
            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
        });
    </script>

</body>
</html>
